name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build all platforms
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
